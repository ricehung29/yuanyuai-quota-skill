<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Token 監控</title>
    <link rel="manifest" href="data:application/manifest+json,{}" id="manifestPlaceholder">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Token Monitor">
    <style>
        :root {
            --glass: rgba(255,255,255,0.25);
            --glass-border: rgba(255,255,255,0.35);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --text: #1e293b;
            --text-secondary: #334155;
            --muted: #475569;
            --dim: #64748b;
            --green: #059669;
            --green-glow: rgba(5,150,105,0.2);
            --yellow: #d97706;
            --yellow-glow: rgba(217,119,6,0.2);
            --red: #dc2626;
            --red-glow: rgba(220,38,38,0.25);
            --cyan: #0891b2;
            --cyan-glow: rgba(8,145,178,0.15);
            --blue: #2563eb;
            --blue-glow: rgba(37,99,235,0.15);
            --radius-sm: 12px;
            --radius: 18px;
            --radius-lg: 24px;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f0e6ff 25%, #e0f2fe 50%, #ccfbf1 75%, #fef3c7 100%);
            --card-bg: var(--glass);
            --card-border: var(--glass-border);
            --card-shadow: var(--glass-shadow);
            --bar-bg: rgba(255,255,255,0.3);
            --input-bg: rgba(255,255,255,0.5);
            --input-bg-focus: rgba(255,255,255,0.7);
            --bg-glow-1: radial-gradient(circle, rgba(8,145,178,0.08) 0%, transparent 70%);
            --bg-glow-2: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 70%);
        }
        /* dark mode vars */
        html.dark {
            --glass: rgba(30,41,59,0.7);
            --glass-border: rgba(71,85,105,0.5);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.3);
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --muted: #94a3b8;
            --dim: #64748b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #0c4a6e 50%, #134e4a 75%, #292524 100%);
            --card-bg: var(--glass);
            --card-border: var(--glass-border);
            --card-shadow: var(--glass-shadow);
            --bar-bg: rgba(255,255,255,0.08);
            --input-bg: rgba(30,41,59,0.5);
            --input-bg-focus: rgba(30,41,59,0.7);
            --bg-glow-1: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 70%);
            --bg-glow-2: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
        }
        /* normal theme */
        html.normal, html.normal.dark {
            --glass: initial;
            --glass-border: initial;
            --glass-shadow: initial;
            --card-bg: initial;
            --card-border: initial;
            --card-shadow: initial;
        }
        html.normal {
            --bg-gradient: #ffffff;
            --text: #0f172a;
            --text-secondary: #334155;
            --muted: #475569;
            --dim: #94a3b8;
            --bar-bg: #e2e8f0;
            --input-bg: #f1f5f9;
            --input-bg-focus: #ffffff;
            --bg-glow-1: none;
            --bg-glow-2: none;
        }
        html.normal.dark {
            --bg-gradient: #0f172a;
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --muted: #94a3b8;
            --dim: #64748b;
            --bar-bg: #1e293b;
            --input-bg: #1e293b;
            --input-bg-focus: #334155;
            --bg-glow-1: none;
            --bg-glow-2: none;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--text);
            padding: 24px 20px;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-gradient);
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: var(--bg-glow-1);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: var(--bg-glow-2);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }

        .glass {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
        }

        .header {
            display:flex; align-items:center; gap:8px; margin-bottom:6px;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius);
            padding: 12px 18px;
        }
        .header .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .header .dot.ok { background:var(--green); box-shadow:0 0 8px var(--green-glow); }
        .header .dot.warn { background:var(--yellow); box-shadow:0 0 8px var(--yellow-glow); }
        .header .dot.danger { background:var(--red); box-shadow:0 0 10px var(--red-glow); animation:pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .header h1 { font-size:17px; font-weight:700; color:var(--text); cursor:pointer; }
        .header .key-entry { margin-left:auto; display:flex; align-items:center; gap:4px; }
        .header .key-entry input {
            font-size:10px; font-family:'SF Mono','Fira Code',monospace;
            color:var(--muted); background:var(--input-bg); border:1px solid var(--card-border, var(--glass-border));
            padding:3px 8px; border-radius:6px; width:110px; outline:none; backdrop-filter:blur(4px);
        }
        .header .key-entry input:focus { border-color:var(--cyan); color:var(--text); background:var(--input-bg-focus); }
        .header .key-entry .kbtn {
            font-size:10px; padding:3px 6px; border:1px solid var(--card-border, var(--glass-border));
            border-radius:6px; background:var(--card-bg, rgba(255,255,255,0.3)); cursor:pointer; color:var(--dim); backdrop-filter:blur(4px);
        }
        .header .key-entry .kbtn:hover { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-glow); }

        .sub-row { display:flex; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-bottom:16px; margin-left:18px; }
        .sub-row .pill {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
            border: 1px solid var(--card-border, var(--glass-border));
            padding: 3px 12px; border-radius: 20px; color: var(--muted);
        }
        .sub-row .pill strong { color: var(--text-secondary); font-weight:500; }

        .toast { background:rgba(254,202,202,0.7); backdrop-filter:blur(12px); border:1px solid var(--card-border, rgba(254,202,202,0.5)); border-radius:12px; padding:8px 14px; color:var(--red); font-size:12px; margin-bottom:14px; display:none; }
        .toast.show { display:block; }

        .btn-refresh {
            display:flex; align-items:center; justify-content:center; gap:8px;
            width:100%; margin-bottom:14px; padding:14px 24px;
            border-radius: var(--radius-sm);
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            color: var(--cyan);
            cursor:pointer; font-size:15px; font-weight:600;
            transition:all 0.2s; font-family:inherit;
        }
        .btn-refresh:hover { background:rgba(8,145,178,0.12); border-color:var(--cyan); box-shadow:0 8px 24px rgba(8,145,178,0.1); }
        .btn-refresh:active { transform:scale(0.98); }

        .remain-hero {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-lg);
            padding: 28px 28px 24px;
            margin-bottom:16px; text-align:center; position:relative; overflow:hidden;
        }
        .remain-hero::before {
            content:''; position:absolute; top:-30px; right:-30px;
            width:100px; height:100px; border-radius:50%;
            background:var(--cyan-glow); pointer-events:none;
        }
        .remain-hero .rh-label { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--cyan); font-weight:700; position:relative; z-index:1; }
        .remain-hero .rh-row {
            display:flex; align-items:baseline; justify-content:center; gap:14px;
            position:relative; z-index:1; margin:4px 0 4px;
            cursor:pointer; user-select:none;
        }
        .remain-hero .rh-row .big-pct { font-size:80px; font-weight:800; line-height:1; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:-3px; position:relative; z-index:1; }
        .remain-hero .rh-row .big-pct.warn { color:var(--yellow); }
        .remain-hero .rh-row .big-pct.danger { color:var(--red); }
        .remain-hero .rh-row .sec-num { font-size:28px; font-weight:600; color:var(--dim); font-variant-numeric:tabular-nums; position:relative; z-index:1; transition:color .2s; }
        .remain-hero .rh-row .sec-num:hover { color:var(--text-secondary); }
        .remain-hero .rh-sub { font-size:13px; color:var(--dim); position:relative; z-index:1; }
        .remain-hero .rh-sub strong { color:var(--text-secondary); font-weight:600; }

        .gauge-row { display:flex; gap:10px; margin-bottom:14px; align-items:stretch; }
        .donut-box {
            flex:0 0 100px;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius);
            padding:14px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .donut-box svg { width:66px; height:66px; transform:rotate(-90deg); }
        .donut-box .bg-ring { fill:none; stroke:var(--bar-bg); stroke-width:6; }
        .donut-box .fg-ring { fill:none; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 0.6s,stroke 0.6s; }
        .donut-box .donut-label { font-size:10px; color:var(--dim); margin-top:4px; }
        .donut-box .donut-label span { color:var(--text-secondary); font-weight:600; }

        .stat-grid { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .s-card {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-sm);
            padding:10px 14px;
        }
        .s-card .s-label { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:0.5px; }
        .s-card .s-val { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-secondary); }
        .s-card .s-note { font-size:10px; color:var(--dim); }

        .charts-row { display:flex; gap:10px; margin-bottom:14px; }
        .charts-row .ch-card {
            flex:1;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius);
            padding:14px 16px 12px;
        }
        .charts-row .ch-card .ch-label { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
        .charts-row .ch-card .ch-label span { color:var(--text-secondary); font-weight:600; }

        .big-bar { display:flex; height:38px; border-radius:10px; overflow:hidden; background:var(--bar-bg); }
        .big-bar .seg { display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; transition:width 0.6s ease; min-width:0; }
        .big-bar .seg.used { background:linear-gradient(135deg,#2563eb,#3b82f6); }
        .big-bar .seg.remain { background:linear-gradient(135deg,#059669,#22c55e); }
        .big-bar-labels { display:flex; justify-content:space-between; margin-top:5px; font-size:10px; color:var(--dim); }
        .big-bar-labels .lb { display:flex; align-items:center; gap:3px; }
        .big-bar-labels .lb .sw { width:7px; height:7px; border-radius:2px; display:inline-block; }

        .stack-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
        .stack-row .sl { font-size:10px; color:var(--dim); width:48px; flex-shrink:0; }
        .stack-row .sr { flex:1; height:22px; background:var(--bar-bg); border-radius:6px; overflow:hidden; display:flex; }
        .stack-row .sr .sb { display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:600; color:#fff; transition:width .5s; }
        .stack-row .sr .sb.blue { background:#3b82f6; }
        .stack-row .sr .sb.orange { background:#f59e0b; }
        .stack-row .sr .sb.green { background:#22c55e; }
        .stack-row .sv { font-size:11px; font-weight:600; color:var(--text-secondary); width:40px; text-align:right; font-variant-numeric:tabular-nums; }
        .multi-breakdown { font-size:10px; color:var(--dim); margin-top:6px; }

        .insight-row { display:flex; gap:8px; margin-bottom:12px; }
        .in-card {
            flex:1;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-sm);
            padding:12px 14px;
        }
        .in-card .it { font-size:11px; font-weight:600; color:var(--text-secondary); margin-bottom:3px; }
        .in-card .ib { font-size:12px; color:var(--muted); line-height:1.5; }
        .in-card.ok { border-left:3px solid var(--green); }
        .in-card.warn { border-left:3px solid var(--yellow); }
        .in-card.bad { border-left:3px solid var(--red); }

        .tbar {
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-sm);
            padding:10px 16px; margin-bottom:14px;
        }
        .tbar .tbit { font-size:10px; color:var(--dim); white-space:nowrap; }
        .tbar .tbit .tv { color:var(--text-secondary); font-weight:500; }
        .tbar .cntdown { font-size:18px; font-weight:700; color:var(--cyan); margin-left:auto; font-variant-numeric:tabular-nums; }

        @media (max-width:480px) {
            body { padding:12px; }
            .remain-hero { padding:22px 16px; }
            .remain-hero .rh-num { font-size:52px; }
            .insight-row { flex-direction:column; }
            .charts-row { flex-direction:column; }
        }

        /* settings panel */
        .settings-overlay {
            position: fixed; inset:0; z-index:999;
            background:rgba(0,0,0,0.3); backdrop-filter:blur(4px);
            opacity:0; visibility:hidden; transition:all 0.25s;
        }
        .settings-overlay.open { opacity:1; visibility:visible; }
        .settings-panel {
            position:fixed; top:0; right:-320px; width:300px; height:100vh;
            z-index:1000; padding:24px 20px;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border-left: 1px solid var(--card-border, var(--glass-border));
            box-shadow: -4px 0 24px rgba(0,0,0,0.1);
            transition:right 0.3s cubic-bezier(.22,1,.36,1);
            overflow-y:auto;
        }
        .settings-panel.open { right:0; }
        .settings-panel .sp-h { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
        .settings-panel .sp-h h2 { font-size:15px; font-weight:700; color:var(--text); }
        .settings-panel .sp-h .sp-close {
            margin-left:auto; font-size:18px; cursor:pointer; color:var(--dim);
            width:28px; height:28px; display:flex; align-items:center; justify-content:center;
            border-radius:8px; border:1px solid var(--card-border, var(--glass-border));
            background:var(--card-bg, rgba(255,255,255,0.15));
        }
        .settings-panel .sp-h .sp-close:hover { color:var(--text); background:rgba(0,0,0,0.05); }
        .sp-group { margin-bottom:18px; }
        .sp-group .sg-label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:8px; font-weight:600; }
        .sp-opt { display:flex; gap:6px; flex-wrap:wrap; }
        .sp-opt .so-btn {
            padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer;
            border:1px solid var(--card-border, var(--glass-border));
            background:var(--card-bg, rgba(255,255,255,0.15));
            color:var(--muted); transition:all 0.15s; font-family:inherit;
        }
        .sp-opt .so-btn:hover { border-color:var(--cyan); color:var(--text); }
        .sp-opt .so-btn.active { background:var(--cyan); color:#fff; border-color:var(--cyan); }
        .sp-toggle { display:flex; align-items:center; gap:10px; padding:6px 0; }
        .sp-toggle .st-label { font-size:13px; color:var(--text-secondary); flex:1; }
        .sp-toggle input[type="checkbox"] {
            width:36px; height:20px; border-radius:10px; border:1px solid var(--card-border, var(--glass-border));
            background:var(--bar-bg); appearance:none; cursor:pointer; position:relative; transition:all 0.2s;
            flex-shrink:0;
        }
        .sp-toggle input[type="checkbox"]::after {
            content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
            border-radius:50%; background:var(--dim); transition:all 0.2s;
        }
        .sp-toggle input[type="checkbox"]:checked { background:var(--cyan); border-color:var(--cyan); }
        .sp-toggle input[type="checkbox"]:checked::after { left:18px; background:#fff; }

        /* inline SVG icon styles */
        .icon-svg { width:14px; height:14px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .icon-svg-sm { width:12px; height:12px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .icon-svg-lg { width:18px; height:18px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

        .title-input {
            border:none; background:transparent; font-size:17px; font-weight:700;
            color:var(--text); font-family:inherit; outline:none; cursor:text; width:auto;
            border-bottom:1px dashed transparent; transition:border-color 0.2s;
        }
        .title-input:focus { border-bottom-color:var(--cyan); }
    </style>
</head>
<body>
<div class="container">

<div class="header">
    <div class="dot ok" id="statusDot"></div>
    <input class="title-input" id="titleInput" value="Token 用量監控" spellcheck="false" maxlength="30" />
    <div class="key-entry">
        <input type="password" id="apiKeyInput" placeholder="API Key" spellcheck="false" />
        <button class="kbtn" onclick="sk()" title="儲存">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="kbtn" onclick="toggleSettings()" title="設定">

<script>
const API='https://yuanyuaicloud.cn', DONUT=2*Math.PI*28, SK='yuanyuai_api_key', TS='yuanyuai_title';
function gk(){return localStorage.getItem(SK);}
function sk(){
    const i=document.getElementById('apiKeyInput'), r=i.value.trim();
    if(!r)return; let k=r;
    if(!k.toLowerCase().startsWith('sk-'))k='sk-'+k;
    localStorage.setItem(SK,k); i.value=k; i.style.color='#059669'; f();
    setTimeout(()=>i.style.color='',1500);
}
function skFromSettings(){
    const i=document.getElementById('settingsKeyInput'), r=i.value.trim();
    if(!r)return; let k=r;
    if(!k.toLowerCase().startsWith('sk-'))k='sk-'+k;
    localStorage.setItem(SK,k);
    document.getElementById('apiKeyInput').value=k;
    i.value=''; f();
}
(function(){
    const i=document.getElementById('apiKeyInput');
    i.value=gk();
    i.addEventListener('keydown',e=>{if(e.key==='Enter')sk();});
    const params=new URLSearchParams(window.location.search);
    const qk=params.get('key');
    if(qk){i.value=qk;sk();}
    // restore title
    const savedTitle=localStorage.getItem(TS);
    if(savedTitle)document.getElementById('titleInput').value=savedTitle;
})();

let ld=null,dispMode='pct';
function toggleDisplay(){dispMode=dispMode==='pct'?'count':'pct';if(ld)render(ld);}
function updateHero(pct,rm){
    const big=document.getElementById('bigDisplay'),sec=document.getElementById('secDisplay'),label=document.querySelector('.rh-label');
    const cls='big-pct'+(pct>=90?' danger':pct>=65?' warn':'');
    if(dispMode==='pct'){
        label.textContent='已使用';
        big.textContent=pct.toFixed(0)+'%'; big.className=cls;
        sec.textContent='剩餘 '+fm(rm);
    }else{
        label.textContent='剩餘額度';
        big.textContent=fm(rm); big.className=cls;
        sec.textContent=pct.toFixed(0)+'% 使用';
    }
}
function fm(n){return n===void 0||n===null?'--':Number(n).toLocaleString();}
function st(id,t){const e=document.getElementById(id);if(e)e.textContent=t||'--';}

async function f(){
    const b=document.getElementById('btnRefresh');
    b.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" style="color:currentColor;animation:spin 0.8s linear infinite;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 查詢中...'; b.disabled=true;
    try{
        let k=gk(); if(k.toLowerCase().startsWith('sk-'))k=k.substring(3);
        const r=await fetch(API+'/api/query-quota',{headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'}});
        const j=await r.json();
        if(!r.ok||!j.success)throw new Error(j.message||'查詢失敗');
        ld=j.data; render(j.data);
        st('lastRefreshPill',new Date().toLocaleTimeString('zh-Hant',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    }catch(e){
        const t=document.getElementById('toast');
        t.textContent='❌ '+e.message; t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),5000);
    }finally{
        b.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" style="color:currentColor;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 重新整理';
        b.disabled=false;
    }
}

function render(d){
    const rL=d.rateLimit||3000,b=d.billedCalls||0,re=d.realCalls||0,rm=Math.max(0,d.windowRemain??0),mul=d.currentMultiplier||1,mulL=d.multiplierLabel||'×'+mul,nr=d.nextResetTime||0,ex=d.expiredTime??-1,pct=Math.min(100,b/rL*100),mI=Math.max(0,b-re),now=Date.now();
    updateHero(pct,rm);
    st('bigLimit',fm(rL)); st('bigUsed',fm(b));
    const dot=document.getElementById('statusDot'); dot.className='dot'+(pct>=90?' danger':pct>=65?' warn':' ok');
    const badgeText=settings.showFullBadge?(d.name||d.key||gk())+' · glm-5.2':(d.name||d.key||gk());
    st('tokenName',badgeText);
    st('donutPct',pct.toFixed(0)+'%');
    const arc=document.getElementById('donutArc'); arc.setAttribute('stroke-dashoffset',DONUT*(1-pct/100)); arc.setAttribute('stroke',pct>=90?'#dc2626':pct>=65?'#d97706':'#059669');
    st('billedCalls',fm(b)); st('realCalls',fm(re)); st('multiplierDisplay','×'+mul); st('multiplierCost','+'+fm(mI));
    let br=0,brT='--',brN='--';
    if(nr>0){const ws=nr-5*3600,el=(now/1000)-ws;if(el>60){br=b/(el/60);brT=br<1?'<1 次/分':Math.round(br)+' 次/分';const eP=el/(5*3600)*100,pj=eP>0?Math.round(b/eP*100):0;brN=pj>rL?'⚠ 預估超限 '+fm(pj):'預估 '+fm(pj)+' 次';}}
    st('burnRate',brT); st('burnRateNote',brN);
    charts(b,rm,rL,mI,pct);
    if(nr){const t=new Date(nr*1000),s=t.toLocaleString('zh-Hant',{hour:'2-digit',minute:'2-digit'});st('resetTime',s);st('resetTimeSmall',s);}
    if(ex===-1)st('expiryTime','永久有效');else{const t=new Date(ex*1000);st('expiryTime',t.toLocaleString('zh-Hant',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+(t<new Date()?' 已過期':''));}
    st('multiplierLabel',mulL); CD(nr);
    const i1=document.getElementById('insight1'),i2=document.getElementById('insight2');
    i1.className='in-card'+(pct>=90?' bad':pct>=65?' warn':' ok');
    i1.querySelector('.ib').textContent=pct>=90?`已消耗 ${pct.toFixed(0)}%，即將達到上限。目前倍率 ×${mul} 加速消耗中。`:pct>=65?`已消耗 ${pct.toFixed(0)}%。倍率 ×${mul}，請留意請求頻率。`:mul>1?`用量正常（${pct.toFixed(0)}%）。倍率 ×${mul}，實際請求 ${fm(re)} 次。`:`用量正常（${pct.toFixed(0)}%）。尚有 ${fm(rm)} 次可用額度。`;
    if(nr>0){const rh=(nr-now/1000)/3600;if(br>0&&rh>0){const mu=rm/br;if(mu<rh*60){i2.className='in-card bad';const et=new Date((now/1000+mu*60)*1000);i2.querySelector('.ib').textContent=`以目前速率將於 ${et.toLocaleTimeString('zh-Hant',{hour:'2-digit',minute:'2-digit'})} 耗盡額度，早於重置時間。`;}else{i2.className='in-card ok';i2.querySelector('.ib').textContent=`目前速率下額度充足，可支撐至窗口結束（剩餘 ${rh.toFixed(1)} 小時）。`;}}else{i2.className='in-card ok';i2.querySelector('.ib').textContent='數據收集中，尚無法進行準確預估。';}}
}

function charts(billed,remain,limit,mulI,pct){
    const uP=Math.min(pct,100),rP=Math.max(0,100-uP);
    document.getElementById('segBilled').style.width=uP+'%';document.getElementById('segBilled').textContent=uP>12?fm(billed):'';
    document.getElementById('segRemain').style.width=rP+'%';document.getElementById('segRemain').textContent=rP>12?fm(remain):'';
    st('chartUsed',fm(billed));st('chartRemain',fm(remain));
    const real=billed-mulI,mV=Math.max(billed,real,mulI,1);function pO(v){return(v/mV*100).toFixed(1);}
    document.getElementById('stackB').style.width=pO(billed)+'%';document.getElementById('stackB').textContent=billed>0&&(billed/mV)>0.08?fm(billed):'';
    document.getElementById('stackR').style.width=pO(real)+'%';document.getElementById('stackR').textContent=real>0&&(real/mV)>0.08?fm(real):'';
    document.getElementById('stackM').style.width=pO(mulI)+'%';document.getElementById('stackM').textContent=mulI>0&&(mulI/mV)>0.08?'+'+fm(mulI):'';
    st('stackBVal',fm(billed));st('stackRVal',fm(real));st('stackMVal','+'+fm(mulI));
    const mul=ld?ld.currentMultiplier:1,mulL=ld?ld.multiplierLabel:'×1';
    st('mbd',`倍率 ${mulL}：每 ${mul} 次實際請求計為 1 次計費，已累計 ${fm(mulI)} 次額外消耗`);
}

function CD(ts){
    if(!ts)return;
    const d=Math.max(0,ts-Date.now()/1000),h=Math.floor(d/3600),m=Math.floor((d%3600)/60),s=Math.floor(d%60);
    const str=[h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
    st('countdown',str);st('countdownSmall',str);
}

// settings
const SS='yuanyuai_settings';
function ds(){return JSON.parse(localStorage.getItem(SS)||'{}');}
function ws(s){localStorage.setItem(SS,JSON.stringify(s));}
const defSettings={darkMode:'system',theme:'glass',show:{hero:true,gauge:true,charts:true,insights:true,toolbar:true},refreshInterval:60,showFullBadge:true};
let settings=Object.assign({},defSettings,ds());
let refreshTimer=null;

function applyTheme(){
    const h=document.documentElement;
    if(settings.darkMode==='dark')h.classList.add('dark');
    else if(settings.darkMode==='light')h.classList.remove('dark');
    else {
        const mq=window.matchMedia('(prefers-color-scheme:dark)');
        mq.matches?h.classList.add('dark'):h.classList.remove('dark');
    }
    if(settings.theme==='normal')h.classList.add('normal');
    else h.classList.remove('normal');
}
function applyVisibility(){
    const h=document.getElementById('remainHero'),g=document.getElementById('gaugeRow'),
          ch=document.getElementById('chartsRow'),i=document.getElementById('insightRow'),
          t=document.getElementById('tbar');
    if(h)h.style.display=settings.show.hero?'':'none';
    if(g)g.style.display=settings.show.gauge?'':'none';
    if(ch)ch.style.display=settings.show.charts?'':'none';
    if(i)i.style.display=settings.show.insights?'':'none';
    if(t)t.style.display=settings.show.toolbar?'':'none';
}
function applyRefreshInterval(){
    if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
    if(settings.refreshInterval>0){
        refreshTimer=setInterval(f,settings.refreshInterval*1000);
    }
}
function initSettingsUI(){
    const dm=document.getElementById('darkModeOpts');
    dm.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.v===settings.darkMode);
        b.onclick=()=>{settings.darkMode=b.dataset.v;ws(settings);applyTheme();dm.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',x.dataset.v===settings.darkMode));};
    });
    const th=document.getElementById('themeOpts');
    th.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.v===settings.theme);
        b.onclick=()=>{settings.theme=b.dataset.v;ws(settings);applyTheme();th.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',x.dataset.v===settings.theme));};
    });
    const ri=document.getElementById('refreshIntervalOpts');
    ri.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',Number(b.dataset.v)===settings.refreshInterval);
        b.onclick=()=>{settings.refreshInterval=Number(b.dataset.v);ws(settings);applyRefreshInterval();ri.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',Number(x.dataset.v)===settings.refreshInterval));};
    });
    const fb=document.getElementById('showFullBadge');
    fb.checked=settings.showFullBadge;
    fb.onchange=()=>{settings.showFullBadge=fb.checked;ws(settings);if(ld)render(ld);};
    ['hero','gauge','charts','insights','toolbar'].forEach(k=>{
        const el=document.getElementById('sh'+k.charAt(0).toUpperCase()+k.slice(1));
        if(!el)return;
        el.checked=settings.show[k];
        el.onchange=()=>{settings.show[k]=el.checked;ws(settings);applyVisibility();};
    });
}
function toggleSettings(){
    document.getElementById('settingsOverlay').classList.toggle('open');
    document.getElementById('settingsPanel').classList.toggle('open');
}
// title editing
document.getElementById('titleInput').addEventListener('blur',function(){
    localStorage.setItem(TS,this.value);
});
document.getElementById('titleInput').addEventListener('keydown',function(e){
    if(e.key==='Enter')this.blur();
});

// listen for system dark mode changes
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

applyTheme();
applyVisibility();
applyRefreshInterval();
initSettingsUI();

// spin animation
const styleSheet=document.createElement('style');
styleSheet.textContent='@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
document.head.appendChild(styleSheet);

setInterval(()=>{if(ld)CD(ld.nextResetTime);},500);
f();
