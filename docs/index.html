<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuanyuAI 額度查詢</title>
<meta http-equiv="refresh" content="2;url=https://yuanyuaicloud.cn/query-quota">
<style>
:root{--bg:#f5f7fa;--card:#fff;--border:#e8ecf2;--text:#1a1d29;--sec:#6b7280;--accent:#6366f1}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--sec:#94a3b8}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;max-width:420px;
text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{width:44px;height:44px;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent),#a855f7);
border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
h1{font-size:17px;margin-bottom:10px}
p{font-size:13px;color:var(--sec);line-height:1.7}
a{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;text-decoration:none;
padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600}
code{font-family:'SF Mono',monospace;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Y</div>
  <h1>已改用官方額度查詢面板</h1>
  <p>API 嘅 CORS 已鎖定為 <code>yuanyuaicloud.cn</code>，第三方頁面無法直接查詢。<br>CLI skill 不受影響，繼續可用。</p>
  <a href="https://yuanyuaicloud.cn/query-quota">前往查詢 ↗</a>
</div>

</body>
</html>
