<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Token 監控</title>
    <link rel="manifest" href="data:application/manifest+json,{}" id="manifestPlaceholder">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Token Monitor">
    <style>
        :root {
            --glass: rgba(255,255,255,0.25);
            --glass-border: rgba(255,255,255,0.35);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --text: #1e293b;
            --text-secondary: #334155;
            --muted: #475569;
            --dim: #64748b;
            --green: #059669;
            --green-glow: rgba(5,150,105,0.2);
            --yellow: #d97706;
            --yellow-glow: rgba(217,119,6,0.2);
            --red: #dc2626;
            --red-glow: rgba(220,38,38,0.25);
            --cyan: #0891b2;
            --cyan-glow: rgba(8,145,178,0.15);
            --blue: #2563eb;
            --blue-glow: rgba(37,99,235,0.15);
            --radius-sm: 12px;
            --radius: 18px;
            --radius-lg: 24px;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f0e6ff 25%, #e0f2fe 50%, #ccfbf1 75%, #fef3c7 100%);
            --card-bg: var(--glass);
            --card-border: var(--glass-border);
            --card-shadow: var(--glass-shadow);
            --bar-bg: rgba(255,255,255,0.3);
            --input-bg: rgba(255,255,255,0.5);
            --input-bg-focus: rgba(255,255,255,0.7);
            --bg-glow-1: radial-gradient(circle, rgba(8,145,178,0.08) 0%, transparent 70%);
            --bg-glow-2: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 70%);
        }
        html.dark {
            --glass: rgba(30,41,59,0.7);
            --glass-border: rgba(71,85,105,0.5);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.3);
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --muted: #94a3b8;
            --dim: #64748b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #0c4a6e 50%, #134e4a 75%, #292524 100%);
            --bar-bg: rgba(255,255,255,0.08);
            --input-bg: rgba(30,41,59,0.5);
            --input-bg-focus: rgba(30,41,59,0.7);
            --bg-glow-1: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 70%);
            --bg-glow-2: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
        }
        html.normal, html.normal.dark { --glass:initial; --glass-border:initial; --glass-shadow:initial; --card-bg:initial; --card-border:initial; --card-shadow:initial; }
        html.normal {
            --bg-gradient: #ffffff;
            --text: #0f172a;
            --text-secondary: #334155;
            --muted: #475569;
            --dim: #94a3b8;
            --bar-bg: #e2e8f0;
            --input-bg: #f1f5f9;
            --input-bg-focus: #ffffff;
            --bg-glow-1: none;
            --bg-glow-2: none;
        }
        html.normal.dark {
            --bg-gradient: #0f172a;
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --muted: #94a3b8;
            --dim: #64748b;
            --bar-bg: #1e293b;
            --input-bg: #1e293b;
            --input-bg-focus: #334155;
            --bg-glow-1: none;
            --bg-glow-2: none;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--text);
            padding: 24px 20px;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-gradient);
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: var(--bg-glow-1);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -20%;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: var(--bg-glow-2);
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }

        .glass {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
        }

        .header {
            display:flex; align-items:center; gap:8px; margin-bottom:6px;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius);
            padding: 12px 18px;
        }
        .header .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .header .dot.ok { background:var(--green); box-shadow:0 0 8px var(--green-glow); }
        .header .dot.warn { background:var(--yellow); box-shadow:0 0 8px var(--yellow-glow); }
        .header .dot.danger { background:var(--red); box-shadow:0 0 10px var(--red-glow); animation:pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .header h1 { font-size:17px; font-weight:700; color:var(--text); cursor:pointer; }
        .header .key-entry { margin-left:auto; display:flex; align-items:center; gap:4px; }
        .header .key-entry .kbtn {
            font-size:10px; padding:3px 6px; border:1px solid var(--card-border, var(--glass-border));
            border-radius:6px; background:var(--card-bg, rgba(255,255,255,0.3)); cursor:pointer; color:var(--dim); backdrop-filter:blur(4px);
        }
        .header .key-entry .kbtn:hover { color:var(--cyan); border-color:var(--cyan); background:var(--cyan-glow); }

        .sub-row { display:flex; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-bottom:16px; margin-left:18px; }
        .sub-row .pill {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(12px) saturate(1.3);
            -webkit-backdrop-filter: blur(12px) saturate(1.3);
            border: 1px solid var(--card-border, var(--glass-border));
            padding: 3px 12px; border-radius: 20px; color: var(--muted);
        }
        .sub-row .pill strong { color: var(--text-secondary); font-weight:500; }

        .toast { background:rgba(254,202,202,0.7); backdrop-filter:blur(12px); border:1px solid var(--card-border, rgba(254,202,202,0.5)); border-radius:12px; padding:8px 14px; color:var(--red); font-size:12px; margin-bottom:14px; display:none; }
        .toast.show { display:block; }

        .btn-refresh {
            display:flex; align-items:center; justify-content:center; gap:8px;
            width:100%; margin-bottom:14px; padding:14px 24px;
            border-radius: var(--radius-sm);
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            color: var(--cyan);
            cursor:pointer; font-size:15px; font-weight:600;
            transition:all 0.2s; font-family:inherit;
        }
        .btn-refresh:hover { background:rgba(8,145,178,0.12); border-color:var(--cyan); box-shadow:0 8px 24px rgba(8,145,178,0.1); }
        .btn-refresh:active { transform:scale(0.98); }

        /* limit cards */
        .limit-row { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
        .limit-card {
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-lg);
            padding: 20px 24px 18px;
            position:relative; overflow:hidden;
        }
        .limit-card::before {
            content:''; position:absolute; top:-20px; right:-20px;
            width:80px; height:80px; border-radius:50%;
            background:var(--cyan-glow); pointer-events:none;
        }
        .lc-title { font-size:11px; font-weight:700; color:var(--text-secondary); margin-bottom:10px; letter-spacing:0.3px; }
        .lc-bar-wrap { margin-bottom:10px; }
        .lc-label-row { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
        .lc-bar { height:10px; border-radius:6px; background:var(--bar-bg); overflow:hidden; }
        .lc-bar .fill { height:100%; border-radius:6px; transition:width 0.6s ease; }
        .lc-bar .fill.green { background:linear-gradient(90deg, #059669, #22c55e); }
        .lc-bar .fill.yellow { background:linear-gradient(90deg, #d97706, #f59e0b); }
        .lc-bar .fill.red { background:linear-gradient(90deg, #dc2626, #ef4444); }
        .lc-stats { display:flex; gap:12px; margin-bottom:6px; }
        .lc-stats .item { flex:1; }
        .lc-stats .item .num { font-size:22px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
        .lc-stats .item .label { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:1px; }
        .lc-stats .item.used .num { color:var(--blue); }
        .lc-stats .item.remain .num { color:var(--green); }
        .lc-reset { font-size:10px; color:var(--dim); }
        .lc-reset span { color:var(--text-secondary); font-weight:500; }

        /* info rows */
        .info-row { display:flex; align-items:center; gap:12px; margin-bottom:6px; padding:0 4px; }
        .info-row .label { font-size:11px; color:var(--dim); width:70px; flex-shrink:0; }
        .info-row .value { font-size:12px; color:var(--text-secondary); font-weight:500; }
        .info-row .value .tag {
            display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; font-weight:600;
        }
        .info-row .value .tag.ok { background:var(--green-glow); color:var(--green); }
        .info-row .value .tag.warn { background:var(--yellow-glow); color:var(--yellow); }
        .info-row .value .tag.bad { background:var(--red-glow); color:var(--red); }

        .tbar {
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--card-border, var(--glass-border));
            box-shadow: var(--card-shadow, var(--glass-shadow));
            border-radius: var(--radius-sm);
            padding:10px 16px; margin-bottom:14px;
        }
        .tbar .tbit { font-size:10px; color:var(--dim); white-space:nowrap; }
        .tbar .tbit .tv { color:var(--text-secondary); font-weight:500; }
        .tbar .cntdown { font-size:18px; font-weight:700; color:var(--cyan); margin-left:auto; font-variant-numeric:tabular-nums; }

        @media (max-width:480px) {
            body { padding:12px; }
            .insight-row { flex-direction:column; }
            .charts-row { flex-direction:column; }
        }

        /* settings panel */
        .settings-overlay {
            position: fixed; inset:0; z-index:999;
            background:rgba(0,0,0,0.3); backdrop-filter:blur(4px);
            opacity:0; visibility:hidden; transition:all 0.25s;
        }
        .settings-overlay.open { opacity:1; visibility:visible; }
        .settings-panel {
            position:fixed; top:0; right:-320px; width:300px; height:100vh;
            z-index:1000; padding:24px 20px;
            background: var(--card-bg, var(--glass));
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border-left: 1px solid var(--card-border, var(--glass-border));
            box-shadow: -4px 0 24px rgba(0,0,0,0.1);
            transition:right 0.3s cubic-bezier(.22,1,.36,1);
            overflow-y:auto;
        }
        .settings-panel.open { right:0; }
        .settings-panel .sp-h { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
        .settings-panel .sp-h h2 { font-size:15px; font-weight:700; color:var(--text); }
        .settings-panel .sp-h .sp-close {
            margin-left:auto; font-size:18px; cursor:pointer; color:var(--dim);
            width:28px; height:28px; display:flex; align-items:center; justify-content:center;
            border-radius:8px; border:1px solid var(--card-border, var(--glass-border));
            background:var(--card-bg, rgba(255,255,255,0.15));
        }
        .settings-panel .sp-h .sp-close:hover { color:var(--text); background:rgba(0,0,0,0.05); }
        .sp-group { margin-bottom:18px; }
        .sp-group .sg-label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:8px; font-weight:600; }
        .sp-opt { display:flex; gap:6px; flex-wrap:wrap; }
        .sp-opt .so-btn {
            padding:6px 14px; border-radius:8px; font-size:12px; cursor:pointer;
            border:1px solid var(--card-border, var(--glass-border));
            background:var(--card-bg, rgba(255,255,255,0.15));
            color:var(--muted); transition:all 0.15s; font-family:inherit;
        }
        .sp-opt .so-btn:hover { border-color:var(--cyan); color:var(--text); }
        .sp-opt .so-btn.active { background:var(--cyan); color:#fff; border-color:var(--cyan); }
        .sp-toggle { display:flex; align-items:center; gap:10px; padding:6px 0; }
        .sp-toggle .st-label { font-size:13px; color:var(--text-secondary); flex:1; }
        .sp-toggle input[type="checkbox"] {
            width:36px; height:20px; border-radius:10px; border:1px solid var(--card-border, var(--glass-border));
            background:var(--bar-bg); appearance:none; cursor:pointer; position:relative; transition:all 0.2s;
            flex-shrink:0;
        }
        .sp-toggle input[type="checkbox"]::after {
            content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
            border-radius:50%; background:var(--dim); transition:all 0.2s;
        }
        .sp-toggle input[type="checkbox"]:checked { background:var(--cyan); border-color:var(--cyan); }
        .sp-toggle input[type="checkbox"]:checked::after { left:18px; background:#fff; }

        .icon-svg { width:14px; height:14px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .icon-svg-sm { width:12px; height:12px; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

        .title-input {
            border:none; background:transparent; font-size:17px; font-weight:700;
            color:var(--text); font-family:inherit; outline:none; cursor:text; width:auto;
            border-bottom:1px dashed transparent; transition:border-color 0.2s;
        }
        .title-input:focus { border-bottom-color:var(--cyan); }
    </style>
</head>
<body>
<div class="container">

<div class="header">
    <div class="dot ok" id="statusDot"></div>
    <input class="title-input" id="titleInput" value="Token 用量監控" spellcheck="false" maxlength="30" />
    <div class="key-entry">
        <button class="kbtn" onclick="toggleSettings()" title="設定">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </div>
</div>
<div class="sub-row">
    <span class="pill"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="color:var(--dim);margin-right:2px;"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> <strong id="tokenName">--</strong></span>
    <span class="pill"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="color:var(--dim);margin-right:2px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> <span id="lastRefreshPill" style="font-size:12px;">--</span></span>
</div>

<div class="toast" id="toast"></div>

<button class="btn-refresh" onclick="f()" id="btnRefresh">
    <svg class="icon-svg" viewBox="0 0 24 24" style="color:currentColor;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    重新整理
</button>

<div class="limit-row" id="limitRow">

    <!-- 周限额 -->
    <div class="limit-card" id="weeklyCard">
        <div class="lc-title">📊 本周限額（週一 00:00 重置）</div>
        <div class="lc-bar-wrap">
            <div class="lc-label-row">
                <span>已用 <span id="weeklyUsed">0</span> / <span id="weeklyLimit">12,000</span></span>
                <span id="weeklyPercent">0.0%</span>
            </div>
            <div class="lc-bar"><div class="fill green" id="weeklyFill" style="width:0%"></div></div>
        </div>
        <div class="lc-stats">
            <div class="item used"><div class="num" id="weeklyBilled">0</div><div class="label">已用（計費）</div></div>
            <div class="item remain"><div class="num" id="weeklyRemain">12,000</div><div class="label">剩餘</div></div>
        </div>
        <div class="lc-reset">🔄 重置時間：<span id="weeklyReset">--</span></div>
    </div>

    <!-- 窗口限額 -->
    <div class="limit-card" id="windowCard">
        <div class="lc-title">⏱️ 當前窗口（5 小時，1/6/11/16/21 點重置）</div>
        <div class="lc-bar-wrap">
            <div class="lc-label-row">
                <span>已用 <span id="winUsed">0</span> / <span id="winLimit">1,000</span></span>
                <span id="winPercent">0.0%</span>
            </div>
            <div class="lc-bar"><div class="fill green" id="winFill" style="width:0%"></div></div>
        </div>
        <div class="lc-stats">
            <div class="item used"><div class="num" id="winBilled">0</div><div class="label">已用（計費）</div></div>
            <div class="item remain"><div class="num" id="winRemain">1,000</div><div class="label">剩餘</div></div>
        </div>
        <div class="lc-reset">🔄 重置時間：<span id="windowReset">--</span></div>
    </div>

</div>

<!-- 信息行 -->
<div class="info-row" id="statusRow">
    <div class="label">令牌狀態</div>
    <div class="value" id="tokenStatus"><span class="tag ok">正常</span></div>
</div>
<div class="info-row" id="resetRow">
    <div class="label">下次重置</div>
    <div class="value" id="resetInfo">--</div>
</div>
<div class="info-row">
    <div class="label">到期時間</div>
    <div class="value" id="expiryValue">--</div>
</div>
<div class="info-row">
    <div class="label">倍率</div>
    <div class="value" id="multiplierInfo">--</div>
</div>

<div class="tbar" id="tbar">
    <div class="tbit"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="color:var(--dim);margin-right:1px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 窗口重置 <span class="tv" id="resetTime">--</span></div>
    <div class="tbit"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="color:var(--dim);margin-right:1px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 到期 <span class="tv" id="expiryTime">--</span></div>
    <div class="cntdown" id="countdown">--</div>
</div>

</div>

<!-- settings overlay + panel -->
<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <div class="sp-h">
        <h2><svg class="icon-svg" viewBox="0 0 24 24" style="margin-right:4px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 設定</h2>
        <div class="sp-close" onclick="toggleSettings()">✕</div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><circle cx="12" cy="12" r="10"/><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> 深色模式</div>
        <div class="sp-opt" id="darkModeOpts">
            <button class="so-btn" data-v="light">淺色</button>
            <button class="so-btn" data-v="dark">深色</button>
            <button class="so-btn" data-v="system">系統</button>
        </div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> 主題</div>
        <div class="sp-opt" id="themeOpts">
            <button class="so-btn" data-v="glass">Liquid Glass</button>
            <button class="so-btn" data-v="normal">Normal</button>
        </div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> API Key</div>
        <div style="display:flex;gap:6px;margin-bottom:6px;">
            <input type="password" id="apiKeyInput" placeholder="sk-xxxxx" spellcheck="false" style="flex:1;font-size:11px;font-family:'SF Mono','Fira Code',monospace;color:var(--text);background:var(--input-bg);border:1px solid var(--card-border, var(--glass-border));padding:6px 10px;border-radius:6px;outline:none;" />
            <button class="so-btn" onclick="sk()" style="padding:6px 12px;">儲存</button>
        </div>
        <div class="sp-toggle"><span class="st-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><circle cx="12" cy="12" r="10"/></svg> 完整 AI Badge</span><input type="checkbox" id="showFullBadge" checked></div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 自動刷新</div>
        <div class="sp-opt" id="refreshIntervalOpts">
            <button class="so-btn" data-v="30">30s</button>
            <button class="so-btn" data-v="60">1m</button>
            <button class="so-btn" data-v="120">2m</button>
            <button class="so-btn" data-v="300">5m</button>
            <button class="so-btn" data-v="0">關閉</button>
        </div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg> GitHub</div>
        <div style="padding:4px 0;">
            <a href="https://github.com/ricehung29/yuanyuai-quota-skill" target="_blank" style="font-size:12px;color:var(--cyan);text-decoration:none;">ricehung29/yuanyuai-quota-skill ↗</a>
        </div>
    </div>
    <div class="sp-group">
        <div class="sg-label"><svg class="icon-svg-sm" viewBox="0 0 24 24" style="margin-right:2px;"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> 顯示區塊</div>
        <div class="sp-toggle"><span class="st-label">工具列</span><input type="checkbox" id="shToolbar" checked></div>
    </div>
</div>

<script>
const API='https://yuanyuaicloud.cn', SK='yuanyuai_api_key', TS='yuanyuai_title';
function gk(){return localStorage.getItem(SK);}
function sk(){
    const i=document.getElementById('apiKeyInput'), r=i.value.trim();
    if(!r)return; let k=r;
    if(!k.toLowerCase().startsWith('sk-'))k='sk-'+k;
    localStorage.setItem(SK,k); i.style.color='#059669'; f();
    setTimeout(()=>i.style.color='',1500);
}
(function(){
    const i=document.getElementById('apiKeyInput');
    i.value=gk();
    i.addEventListener('keydown',e=>{if(e.key==='Enter')sk();});
    const params=new URLSearchParams(window.location.search);
    const qk=params.get('key');
    if(qk){i.value=qk;sk();}
    const savedTitle=localStorage.getItem(TS);
    if(savedTitle)document.getElementById('titleInput').value=savedTitle;
})();

let ld=null;
function fm(n){return n===void 0||n===null?'--':Number(n).toLocaleString();}
function st(id,t){const e=document.getElementById(id);if(e)e.textContent=t||'--';}
function barClass(pct){return pct>=90?'red':pct>=65?'yellow':'green';}

async function f(){
    const b=document.getElementById('btnRefresh');
    b.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" style="color:currentColor;animation:spin 0.8s linear infinite;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 查詢中...'; b.disabled=true;
    try{
        let k=gk(); if(k.toLowerCase().startsWith('sk-'))k=k.substring(3);
        // 用 no-cors + text() fallback, 因為 server 只允許 yuanyuaicloud.cn 做 origin
        const r=await fetch(API+'/api/query-quota',{mode:'cors',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'}});
        const ct=r.headers.get('content-type')||'';
        let j;
        if(ct.includes('json')){
            j=await r.json();
        }else{
            const txt=await r.text();
            // try parse as JSON anyway
            try{j=JSON.parse(txt);}catch(e){throw new Error('非JSON ('+r.status+'): '+txt.slice(0,80));}
        }
        if(!r.ok||!j.success)throw new Error(j.message||'HTTP '+r.status);
        ld=j.data; render(j.data);
        st('lastRefreshPill',new Date().toLocaleTimeString('zh-Hant',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    }catch(e){
        const t=document.getElementById('toast');
        t.textContent='❌ '+e.message; t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),5000);
    }finally{
        b.innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" style="color:currentColor;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 重新整理';
        b.disabled=false;
    }
}

function render(d){
    const hasWeekly = d.weeklyLimit && d.weeklyLimit > 0;
    document.getElementById('weeklyCard').style.display = hasWeekly ? '' : 'none';

    // weekly
    const wl=hasWeekly ? d.weeklyLimit : 0, wb=hasWeekly ? (d.weeklyBilled||0) : 0, wr=hasWeekly ? (d.weeklyRemain||0) : 0, wp=hasWeekly ? Math.min(100,d.weeklyPercent||(wl>0?wb/wl*100:0)) : 0;
    st('weeklyUsed',fm(wb)); st('weeklyLimit',fm(wl)); st('weeklyPercent',wp.toFixed(1)+'%');
    st('weeklyBilled',fm(wb)); st('weeklyRemain',fm(wr));
    document.getElementById('weeklyFill').style.width=wp+'%';
    document.getElementById('weeklyFill').className='fill '+barClass(wp);
    if(d.nextWeeklyReset){const t=new Date(d.nextWeeklyReset*1000);st('weeklyReset',t.toLocaleString('zh-Hant',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));}

    // window
    const winL=d.rateLimit||1000, winB=d.billedCalls||0, winR=d.windowRemain||0, winP=Math.min(100,winL>0?winB/winL*100:0);
    st('winUsed',fm(winB)); st('winLimit',fm(winL)); st('winPercent',winP.toFixed(1)+'%');
    st('winBilled',fm(winB)); st('winRemain',fm(winR));
    document.getElementById('winFill').style.width=winP+'%';
    document.getElementById('winFill').className='fill '+barClass(winP);
    if(d.nextWindowReset){const t=new Date(d.nextWindowReset*1000);st('windowReset',t.toLocaleString('zh-Hant',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));}

    // token info
    const badgeText=settings.showFullBadge?(d.name||d.key||gk())+' · glm-5.2':(d.name||d.key||gk());
    st('tokenName',badgeText);
    const dot=document.getElementById('statusDot');
    const stP=Math.max(wp,winP);
    dot.className='dot'+(stP>=90?' danger':stP>=65?' warn':' ok');
    const tsEl=document.getElementById('tokenStatus');
    tsEl.innerHTML='<span class="tag '+barClass(stP)+'">'+(stP>=90?'⚠ 已達上限':stP>=65?'⚠ 接近上限':'✅ 正常')+'</span>';

    if(d.nextWindowReset){const t=new Date(d.nextWindowReset*1000);st('resetTime',t.toLocaleString('zh-Hant',{hour:'2-digit',minute:'2-digit'}));st('resetInfo',t.toLocaleString('zh-Hant',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));}
    if(d.expiredTime===-1)st('expiryValue','永久有效');else{const t=new Date(d.expiredTime*1000);st('expiryValue',t.toLocaleString('zh-Hant',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));}
    st('multiplierInfo',d.multiplierLabel||'×'+d.currentMultiplier);
    st('expiryTime',d.expiredTime===-1?'永久有效':new Date(d.expiredTime*1000).toLocaleString('zh-Hant',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
    CD(d.nextWindowReset||d.nextResetTime||0);
}

function CD(ts){
    if(!ts)return;
    const d=Math.max(0,ts-Date.now()/1000),h=Math.floor(d/3600),m=Math.floor((d%3600)/60),s=Math.floor(d%60);
    st('countdown',[h,m,s].map(n=>String(n).padStart(2,'0')).join(':'));
}

// settings
const SS='yuanyuai_settings';
function ds(){return JSON.parse(localStorage.getItem(SS)||'{}');}
function ws(s){localStorage.setItem(SS,JSON.stringify(s));}
const defSettings={darkMode:'system',theme:'glass',show:{toolbar:true},refreshInterval:60,showFullBadge:true};
let settings=Object.assign({},defSettings,ds());
let refreshTimer=null;

function applyTheme(){
    const h=document.documentElement;
    if(settings.darkMode==='dark')h.classList.add('dark');
    else if(settings.darkMode==='light')h.classList.remove('dark');
    else {window.matchMedia('(prefers-color-scheme:dark)').matches?h.classList.add('dark'):h.classList.remove('dark');}
    if(settings.theme==='normal')h.classList.add('normal');
    else h.classList.remove('normal');
}
function applyVisibility(){
    const t=document.getElementById('tbar');
    if(t)t.style.display=settings.show.toolbar?'':'none';
}
function applyRefreshInterval(){
    if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
    if(settings.refreshInterval>0)refreshTimer=setInterval(f,settings.refreshInterval*1000);
}
function initSettingsUI(){
    const dm=document.getElementById('darkModeOpts');
    dm.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.v===settings.darkMode);
        b.onclick=()=>{settings.darkMode=b.dataset.v;ws(settings);applyTheme();dm.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',x.dataset.v===settings.darkMode));};
    });
    const th=document.getElementById('themeOpts');
    th.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.v===settings.theme);
        b.onclick=()=>{settings.theme=b.dataset.v;ws(settings);applyTheme();th.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',x.dataset.v===settings.theme));};
    });
    const ri=document.getElementById('refreshIntervalOpts');
    ri.querySelectorAll('.so-btn').forEach(b=>{
        b.classList.toggle('active',Number(b.dataset.v)===settings.refreshInterval);
        b.onclick=()=>{settings.refreshInterval=Number(b.dataset.v);ws(settings);applyRefreshInterval();ri.querySelectorAll('.so-btn').forEach(x=>x.classList.toggle('active',Number(x.dataset.v)===settings.refreshInterval));};
    });
    const fb=document.getElementById('showFullBadge');
    fb.checked=settings.showFullBadge;
    fb.onchange=()=>{settings.showFullBadge=fb.checked;ws(settings);if(ld)render(ld);};
    const tb=document.getElementById('shToolbar');
    if(tb){tb.checked=settings.show.toolbar;tb.onchange=()=>{settings.show.toolbar=tb.checked;ws(settings);applyVisibility();};}
}
function toggleSettings(){
    document.getElementById('settingsOverlay').classList.toggle('open');
    document.getElementById('settingsPanel').classList.toggle('open');
}
document.getElementById('titleInput').addEventListener('blur',function(){localStorage.setItem(TS,this.value);});
document.getElementById('titleInput').addEventListener('keydown',function(e){if(e.key==='Enter')this.blur();});

window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
applyTheme();
applyVisibility();
applyRefreshInterval();
initSettingsUI();

const styleSheet=document.createElement('style');
styleSheet.textContent='@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
document.head.appendChild(styleSheet);

setInterval(()=>{if(ld)CD(ld.nextWindowReset||ld.nextResetTime||0);},500);
f();

(function(){
    const m={
        name:localStorage.getItem(TS)||'YuanyuAI Token 監控',short_name:'Token 監控',
        start_url:window.location.href.split('?')[0],display:'standalone',
        background_color:'#e0e7ff',theme_color:'#e0e7ff',
        icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#e0e7ff"/><circle cx="96" cy="78" r="44" fill="none" stroke="#0891b2" stroke-width="7"/><text x="96" y="86" text-anchor="middle" fill="#1e293b" font-size="26" font-weight="800">'+(ld?Math.min(100,((ld.weeklyBilled||0)/(ld.weeklyLimit||1)*100)).toFixed(0):'--')+'%</text><text x="96" y="144" text-anchor="middle" fill="#475569" font-size="14" font-weight="500">剩餘 '+(ld?fm(Math.max(0,ld.weeklyRemain||0)):'--')+'</text></svg>'),sizes:'192x192',type:'image/svg+xml'}]
    };
    document.getElementById('manifestPlaceholder').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
})();
</script>
</body>
</html>
